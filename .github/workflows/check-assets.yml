name: Check badge assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Discord CDN assets
        run: python scripts/sync_assets.py
      - name: Validate Guild Tag SVG assets
        run: python scripts/sync_guild_tags.py
      - name: Ensure generated files are unchanged
        run: git diff --exit-code

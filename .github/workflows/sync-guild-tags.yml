name: Sync Guild Tag SVGs

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    paths:
      - "scripts/sync_guild_tags.py"
      - ".github/workflows/sync-guild-tags.yml"
  schedule:
    - cron: "37 3 * * 0"

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'issues' || github.event.issue.title == '[internal] sync guild tags'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sync Discord Guild Tag SVG assets
        run: python scripts/sync_guild_tags.py
      - name: Commit synced assets
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/guild-tags.json assets/guild-tags
          git commit -m "Sync Discord Guild Tag SVG assets"
          git push
